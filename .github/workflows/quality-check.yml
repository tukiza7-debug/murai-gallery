name: Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Flutter bootstrap
        run: |
          chmod +x flutterw
          ./flutterw doctor -v

      - name: Apply play flavor dependencies
        run: |
          cp flavors/pubspec_play.yaml pubspec.yaml
          cp flavors/pubspec_play.lock pubspec.lock
          ./flutterw pub get

      - name: Generate localizations
        run: ./flutterw gen-l10n

      - name: Analyze
        run: ./flutterw analyze

      - name: Test
        run: ./flutterw test
