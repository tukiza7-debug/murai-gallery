name: Release

# Auto-versioned signed release on every push to main and every tag.
#   versionName = tag (e.g. 2.0.0) on tag builds, else 2.0.<run_number>
#   versionCode = 200 + run_number   (v1.0.6 shipped code 6, so 200+ always updates over it)
# Produces per-ABI APKs plus a universal APK, signs them with the keystore
# stored in repository secrets and attaches everything to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          # ubuntu-latest ships the SDK under /usr/local/lib/android/sdk but
          # setup-java resets PATH, so resolve sdkmanager explicitly.
          SDKM=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Export version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="2.0.${GITHUB_RUN_NUMBER}"
          fi
          VER_CODE=$((200 + GITHUB_RUN_NUMBER))
          echo "VER_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "VER_CODE=${VER_CODE}" >> "$GITHUB_ENV"
          echo "Building Murai Gallery ${VERSION} (versionCode ${VER_CODE})"

      - name: Restore keystore from secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/murai-release.jks"
          echo "KEYSTORE_FILE=${{ github.workspace }}/murai-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Build signed release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do sha256sum "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Rename artifacts
        run: |
          cd app/build/outputs/apk/release
          VER="${VER_NAME}"
          mkdir -p out
          for f in *.apk; do
            abi=$(echo "$f" | sed -E 's/app-([a-z0-9_-]+)-release\.apk/\1/')
            if [ "$abi" = "universal" ]; then
              cp "$f" "out/MuraiGallery-${VER}-universal.apk"
            else
              cp "$f" "out/MuraiGallery-${VER}-${abi}.apk"
            fi
          done
          cp SHA256SUMS.txt out/
          ls -la out/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: murai-apks
          path: app/build/outputs/apk/release/out/*

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${VER_NAME}"
          cd app/build/outputs/apk/release/out
          {
            echo "## Murai Gallery ${VER} — Hotfix"
            echo
            echo "A hotfix over v2.0.1 for the launch crash reported on some devices. Full details in the [changelog](https://github.com/tukiza7-debug/murai-gallery/blob/main/CHANGELOG.md)."
            echo
            echo "### Fixed"
            echo "- **Launch crash fixed**: the Gallery (home), Albums, Search, Favorites and Bin screens built their ViewModels through the default reflection factory, which cannot construct container-dependent ViewModels — the app died at first composition with 'Cannot create an instance of class ...' (latent since v2.0.0). Every screen now passes the app's explicit factory, a new regression test fails the build if any viewModel() call site ever loses its factory again, and ViewModel names stay readable in crash logs"
            echo
            echo "### Also in v2.0.1"
            echo "- File paths, scanner, startup, video player, memory, permissions, external intents, navigation, consent dialogs, database safety and crash hardening — see the v2.0.1 notes and the changelog"
            echo
            echo "### Install"
            echo "1. Download the APK for your device (arm64-v8a fits most phones; universal works everywhere)."
            echo "2. Install directly over v2.0.1 — same signature, versionCode increases."
            echo
            echo "### SHA-256 checksums"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > body.md

          gh release create "v${VER}" \
            --title "Murai Gallery v${VER} — Hotfix" \
            --notes-file body.md \
            --latest \
            MuraiGallery-"${VER}"-universal.apk \
            MuraiGallery-"${VER}"-arm64-v8a.apk \
            MuraiGallery-"${VER}"-armeabi-v7a.apk \
            MuraiGallery-"${VER}"-x86_64.apk

      - name: Update rolling Release (main pushes)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${VER_NAME}"
          cd app/build/outputs/apk/release/out
          gh release delete "continuous" --yes --cleanup-tag 2>/dev/null || true
          gh release create "continuous" \
            --title "Murai Gallery ${VER} (development build)" \
            --notes "Automated signed build from main. For the stable major release, use the tagged releases." \
            --prerelease \
            MuraiGallery-"${VER}"-universal.apk \
            MuraiGallery-"${VER}"-arm64-v8a.apk \
            MuraiGallery-"${VER}"-armeabi-v7a.apk \
            MuraiGallery-"${VER}"-x86_64.apk || true
