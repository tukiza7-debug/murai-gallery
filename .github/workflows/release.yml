name: Release

# Auto-versioned signed release on every push to main and every tag.
#   versionName = tag (e.g. 2.0.0) on tag builds, else 2.0.<run_number>
#   versionCode = 200 + run_number   (v1.0.6 shipped code 6, so 200+ always updates over it)
# Produces per-ABI APKs plus a universal APK, signs them with the keystore
# stored in repository secrets and attaches everything to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          # ubuntu-latest ships the SDK under /usr/local/lib/android/sdk but
          # setup-java resets PATH, so resolve sdkmanager explicitly.
          SDKM=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Export version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="2.0.${GITHUB_RUN_NUMBER}"
          fi
          VER_CODE=$((200 + GITHUB_RUN_NUMBER))
          echo "VER_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "VER_CODE=${VER_CODE}" >> "$GITHUB_ENV"
          echo "Building Murai Gallery ${VERSION} (versionCode ${VER_CODE})"

      - name: Restore keystore from secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/murai-release.jks"
          echo "KEYSTORE_FILE=${{ github.workspace }}/murai-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Build signed release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do sha256sum "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Rename artifacts
        run: |
          cd app/build/outputs/apk/release
          VER="${VER_NAME}"
          mkdir -p out
          for f in *.apk; do
            abi=$(echo "$f" | sed -E 's/app-([a-z0-9_-]+)-release\.apk/\1/')
            if [ "$abi" = "universal" ]; then
              cp "$f" "out/MuraiGallery-${VER}-universal.apk"
            else
              cp "$f" "out/MuraiGallery-${VER}-${abi}.apk"
            fi
          done
          cp SHA256SUMS.txt out/
          ls -la out/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: murai-apks
          path: app/build/outputs/apk/release/out/*

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${VER_NAME}"
          cd app/build/outputs/apk/release/out
          {
            echo "## Murai Gallery ${VER} — Stability Update"
            echo
            echo "A crash and major bug-fix release over the v2 rewrite: same app, same features, far fewer ways to fall over. Full details in the [changelog](https://github.com/tukiza7-debug/murai-gallery/blob/main/CHANGELOG.md)."
            echo
            echo "### Fixed"
            echo "- **File paths**: move / copy / rename / delete / EXIF / editor / compressor / motion-photo now stream through MediaStore content URIs instead of misreading the cached relative path as a real file path"
            echo "- **Scanner**: API-correct projections on Android 8–15, trash rows survive rescans (restore keeps working), GPS backfilled in the background so Map / location sort / place labels work, single-flight scanning so a partial or failed pass can never wipe the library cache"
            echo "- **Startup**: crash logger installed first, language restore moved to the main thread, notification channels and WorkManager scheduling guarded — no more launch-time crashes"
            echo "- **Video player**: runBlocking removed, loading state, player lifecycle fixed, decode errors show a friendly retry screen"
            echo "- **Memory**: wallpapers decode to screen size, vault crypto streams in 64 KB chunks (2 GB videos fine, old files still readable), motion-photo trailer search streams, viewer loads ids + a sliding window"
            echo "- **Permissions**: Android 14 selected-photos access is now treated as limited access with a Select more banner instead of a nag loop"
            echo "- **External intents**: 'Open with' opens the exact incoming URI (never the first gallery item), SEND / SEND_MULTIPLE / SET_WALLPAPER handled, works without storage permission, onNewIntent supported"
            echo "- **Navigation**: all dynamic route arguments encoded — folders named A/B, a?b, {x} or unicode can no longer crash the app"
            echo "- **Consent dialogs**: queued instead of overwritten, each launched at most once, always resolved"
            echo "- **Database**: destructive-migration fallback removed, real migrations with exported schema, corrupt-database backup + rebuild instead of wipe"
            echo "- **Crash hardening**: every tool catches its failures into the error log, and a new recovery screen (Copy log / Export log zip) appears after a crash instead of a silent loop"
            echo
            echo "### Install"
            echo "1. Download the APK for your device (arm64-v8a fits most phones; universal works everywhere)."
            echo "2. Install directly over v2.0.0 — same signature, versionCode increases."
            echo
            echo "### SHA-256 checksums"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > body.md

          gh release create "v${VER}" \
            --title "Murai Gallery v${VER} — Stability Update" \
            --notes-file body.md \
            --latest \
            MuraiGallery-"${VER}"-universal.apk \
            MuraiGallery-"${VER}"-arm64-v8a.apk \
            MuraiGallery-"${VER}"-armeabi-v7a.apk \
            MuraiGallery-"${VER}"-x86_64.apk

      - name: Update rolling Release (main pushes)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${VER_NAME}"
          cd app/build/outputs/apk/release/out
          gh release delete "continuous" --yes --cleanup-tag 2>/dev/null || true
          gh release create "continuous" \
            --title "Murai Gallery ${VER} (development build)" \
            --notes "Automated signed build from main. For the stable major release, use the tagged releases." \
            --prerelease \
            MuraiGallery-"${VER}"-universal.apk \
            MuraiGallery-"${VER}"-arm64-v8a.apk \
            MuraiGallery-"${VER}"-armeabi-v7a.apk \
            MuraiGallery-"${VER}"-x86_64.apk || true
