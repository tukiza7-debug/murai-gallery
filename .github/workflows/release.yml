name: Release

# Auto-versioned signed release on every push to main.
# versionName = 1.0.<run_number>, versionCode = <run_number>.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Android NDK
        run: |
          NDK_VERSION=28.2.13676358
          NDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo "NDK $NDK_VERSION not preinstalled; installing..."
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          fi
          test -d "$NDK_DIR"
          echo "NDK ready at $NDK_DIR"

      - name: Flutter bootstrap
        run: |
          chmod +x flutterw
          ./flutterw doctor -v

      - name: Apply play flavor dependencies
        run: |
          cp flavors/pubspec_play.yaml pubspec.yaml
          cp flavors/pubspec_play.lock pubspec.lock
          ./flutterw pub get

      - name: Generate localizations
        run: ./flutterw gen-l10n

      - name: Export version
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=v${VERSION}" >> $GITHUB_ENV

      - name: Prepare signing keystore
        run: |
          echo "${{ secrets.MURAI_KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/murai-release.jks"
          test -s "${RUNNER_TEMP}/murai-release.jks"

      - name: Build split-per-ABI APKs
        env:
          MURAI_STORE_FILE: ${{ runner.temp }}/murai-release.jks
          MURAI_STORE_PASSWORD: ${{ secrets.MURAI_STORE_PASSWORD }}
          MURAI_KEY_ALIAS: ${{ secrets.MURAI_KEY_ALIAS }}
          MURAI_KEY_PASSWORD: ${{ secrets.MURAI_KEY_PASSWORD }}
        run: |
          ./flutterw build apk --release --flavor play -t lib/main_play.dart \
            --split-per-abi \
            --build-name="${VERSION}" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Build universal APK
        env:
          MURAI_STORE_FILE: ${{ runner.temp }}/murai-release.jks
          MURAI_STORE_PASSWORD: ${{ secrets.MURAI_STORE_PASSWORD }}
          MURAI_KEY_ALIAS: ${{ secrets.MURAI_KEY_ALIAS }}
          MURAI_KEY_PASSWORD: ${{ secrets.MURAI_KEY_PASSWORD }}
        run: |
          ./flutterw build apk --release --flavor play -t lib/main_play.dart \
            --build-name="${VERSION}" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/MuraiGallery-${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk     "dist/MuraiGallery-${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk        "dist/MuraiGallery-${VERSION}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk               "dist/MuraiGallery-${VERSION}-universal.apk"
          ls -la dist

      - name: Verify signatures
        run: |
          for apk in dist/*.apk; do
            "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" verify "$apk"
            echo "OK $apk"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Murai Gallery ${{ env.VERSION }}
          body: |
            Automated release of **Murai Gallery ${{ env.VERSION }}** (build ${{ github.run_number }}).

            - `universal` APK works on every device (larger download)
            - per-ABI APKs are smaller — pick the one matching your CPU (usually `arm64-v8a`)

            Based on Aves by deckerst (BSD-3-Clause).
          draft: false
          prerelease: false
          make_latest: true
          files: dist/*.apk
